# This workflow uses Changesets to manage versioning and publish to npmjs.com
# via npm Trusted Publishing (OIDC) - no NPM_TOKEN needed.
#
# It's split into separate jobs (rather than one job doing everything) so that
# id-token: write - required for trusted publishing - is only ever granted to
# the job that actually publishes, per Changesets' own guidance:
# https://changesets.dev/guide/automating#trusted-publishing
#
# On every push to master:
# - select-mode decides whether there are pending changesets ("version") or
#   publishable packages with none pending ("publish").
# - version: opens/updates the "Version Packages" PR.
# - pack + publish: build, pack, and publish to npm. The publish job requires
#   manual approval via the "production" GitHub Environment.
#
# Prerequisite (one-time, on npmjs.com): configure a Trusted Publisher for
# @speedshield/react-native-ssh-sftp pointing at this exact workflow file
# (SpeedshieldTechnologies/react-native-ssh-sftp, workflow: release.yml).
#
# A manual "Run workflow" dispatch instead publishes a snapshot release (Changesets' snapshot
# mode: https://github.com/changesets/changesets/blob/main/docs/snapshot-releases.md) under a
# throwaway npm dist-tag, for testing a branch before it's ready for a real versioned release.
# This lives in the same file as the regular release flow, rather than a separate workflow,
# specifically so it stays covered by the Trusted Publisher registration above - npm's OIDC
# trust is bound to this exact workflow path, and a second file would need its own registration.
# It never commits a version bump anywhere (snapshot versions are throwaway by design).

name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      snapshot-tag:
        description: 'npm dist-tag to publish a snapshot release under (e.g. "next", a branch name)'
        required: true
        default: 'next'

# recommended: reset permissions and explicitly specify for each job
permissions: {}

# recommended: avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to check out repo (actions/checkout) and commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: npm ci

      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        with:
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # to check out repo (actions/checkout) and to create releases (changesets/action/publish)
      id-token: write # for trusted publishing (changesets/action/publish)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: npm ci

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true

  snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # same OIDC-gated approval as a real publish - this is still a real npm publish
    permissions:
      contents: read # to check out repo (actions/checkout)
      id-token: write # for trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Version as a snapshot (never committed - see changesets/changesets snapshot docs)
        run: npx changeset version --snapshot "${{ inputs.snapshot-tag }}"

      - name: Publish snapshot
        run: npx changeset publish --tag "${{ inputs.snapshot-tag }}"
